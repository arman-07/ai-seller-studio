# Generate the Xcode project on a Mac:
#   brew install xcodegen && cd apps/ios && xcodegen
name: ListingStudio
options:
  bundleIdPrefix: com.aisellerstudio
  deploymentTarget:
    iOS: "17.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
targets:
  ListingStudio:
    type: application
    platform: iOS
    sources: [ListingStudio]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: Supabase
      - package: RevenueCat
    entitlements:
      path: ListingStudio/Resources/ListingStudio.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: ListingStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Listing Studio
        UILaunchScreen: {}
        NSCameraUsageDescription: Take photos of the products you sell.
        NSPhotoLibraryUsageDescription: Pick product photos from your library.
        NSPhotoLibraryAddUsageDescription: Save finished product photos to your library.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
